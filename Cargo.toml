[workspace]
members = [
    "crates/onda",
    "crates/onda-core",
    "crates/onda-modal",
    "crates/onda-render",
    "crates/onda-config",
    "crates/onda-syntax",
    "crates/onda-lsp",
    "crates/onda-terminal",
    "crates/onda-session",
    "crates/onda-lua",
    "crates/onda-git",
    "crates/onda-agent",
    "crates/onda-data",
    "xtask",
    "bench",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["onda contributors"]
repository = "https://github.com/onda-editor/onda"

[workspace.dependencies]
# Core text engine
ropey = "1.6"
unicode-segmentation = "1.11"
unicode-width = "0.2"

# Terminal
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "fs", "macros", "time", "process"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Data structures
smallvec = { version = "1", features = ["serde", "union"] }

# Serialization (bench reporting, config)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bit flags
bitflags = "2"

# Testing
tempfile = "3"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Syntax / parsing
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-json = "0.21"
tree-sitter-go = "0.21"
tree-sitter-c = "0.21"
tree-sitter-typescript = "0.21"

# Regex
regex = "1"

# TOML parsing
toml = "0.8"

# Fuzzy matching
nucleo-matcher = "0.3"

# File-system watching
notify = "6"

# Gitignore-aware directory traversal
ignore = "0.4"

# LSP types
lsp-types = "0.97"

# PTY management
portable-pty = "0.9"

# VT100 terminal emulation
vt100 = "0.16"

# Lua 5.4 embedding
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# Git integration (libgit2 bindings)
git2 = { version = "0.19", default-features = false }

# URL parsing (used by lsp-types)
url = "2"

# Crate cross-references
onda-core = { path = "crates/onda-core" }
onda-render = { path = "crates/onda-render" }
onda-modal = { path = "crates/onda-modal" }
onda-config = { path = "crates/onda-config" }
onda-syntax = { path = "crates/onda-syntax" }
onda-lsp = { path = "crates/onda-lsp" }
onda-terminal = { path = "crates/onda-terminal" }
onda-session = { path = "crates/onda-session" }
onda-lua = { path = "crates/onda-lua" }
onda-git = { path = "crates/onda-git" }
onda-agent = { path = "crates/onda-agent" }
onda-data = { path = "crates/onda-data" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
