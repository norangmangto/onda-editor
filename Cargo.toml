[workspace]
members = [
    "crates/onda",
    "crates/onda-core",
    "crates/onda-modal",
    "crates/onda-render",
    "crates/onda-config",
    "xtask",
    "bench",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["onda contributors"]
repository = "https://github.com/onda-editor/onda"

[workspace.dependencies]
# Core text engine
ropey = "1.6"
unicode-segmentation = "1.11"
unicode-width = "0.2"

# Terminal
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "fs", "macros"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Data structures
smallvec = { version = "1", features = ["serde", "union"] }

# Serialization (bench reporting, config)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bit flags
bitflags = "2"

# Testing
tempfile = "3"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Crate cross-references
onda-core = { path = "crates/onda-core" }
onda-render = { path = "crates/onda-render" }
onda-modal = { path = "crates/onda-modal" }
onda-config = { path = "crates/onda-config" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
